[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-aware-ai-inference-platform"
version = "0.1.0"
description = "Queue-driven model serving with Kubernetes deployment and observability"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "redis>=5,<7", "prometheus-client>=0.20,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
model = ["transformers>=4.40,<5", "torch>=2.2,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "fakeredis>=2.23,<3", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
